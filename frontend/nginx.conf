server {
    listen 80;
    root /usr/share/nginx/html;

    # API, uploaded images and the OAuth2 handshake go to the backend container.
    location ~ ^/(api|images|oauth2|login/oauth2)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 6m;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other route is handled client-side.
    location / {
        try_files $uri /index.html;
    }
}
