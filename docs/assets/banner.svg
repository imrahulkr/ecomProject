<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Vendora - multi-vendor marketplace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <!-- decorative circles -->
  <circle cx="1080" cy="40" r="140" fill="#f472b6" opacity="0.18"/>
  <circle cx="980" cy="300" r="90" fill="#38bdf8" opacity="0.16"/>
  <circle cx="120" cy="330" r="110" fill="#a78bfa" opacity="0.18"/>
  <circle cx="1150" cy="250" r="40" fill="#fde047" opacity="0.25"/>

  <!-- shopping bag icon -->
  <g transform="translate(90 92)">
    <path d="M40 18 C40 -8 100 -8 100 18" fill="none" stroke="#fde68a" stroke-width="9" stroke-linecap="round"/>
    <rect x="0" y="24" width="140" height="128" rx="20" fill="url(#bag)"/>
    <circle cx="44" cy="58" r="7" fill="#7c2d12" opacity="0.55"/>
    <circle cx="96" cy="58" r="7" fill="#7c2d12" opacity="0.55"/>
    <path d="M44 92 C56 112 84 112 96 92" fill="none" stroke="#7c2d12" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  </g>

  <text x="280" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#title)">Vendora</text>
  <text x="284" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e9d5ff">A multi-vendor marketplace: many sellers, one cart, safe payments</text>

  <!-- tech pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="284" y="214" width="150" height="36" rx="18" fill="#22c55e"/>
    <text x="359" y="238" text-anchor="middle" fill="#052e16">Spring Boot 4</text>
    <rect x="446" y="214" width="96" height="36" rx="18" fill="#f59e0b"/>
    <text x="494" y="238" text-anchor="middle" fill="#451a03">Java 21</text>
    <rect x="554" y="214" width="110" height="36" rx="18" fill="#38bdf8"/>
    <text x="609" y="238" text-anchor="middle" fill="#082f49">React 19</text>
    <rect x="676" y="214" width="128" height="36" rx="18" fill="#60a5fa"/>
    <text x="740" y="238" text-anchor="middle" fill="#172554">PostgreSQL</text>
    <rect x="816" y="214" width="96" height="36" rx="18" fill="#a78bfa"/>
    <text x="864" y="238" text-anchor="middle" fill="#2e1065">Stripe</text>
    <rect x="924" y="214" width="116" height="36" rx="18" fill="#f472b6"/>
    <text x="982" y="238" text-anchor="middle" fill="#500724">Razorpay</text>
  </g>
  <text x="284" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#f5d0fe">Idempotent checkout · locked payment transitions · item refunds · seller payouts · email outbox</text>
</svg>
