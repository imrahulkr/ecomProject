spring.application.name=ecom

# Off: with it on (Spring Boot's default) a single Hibernate session is bound to the whole HTTP
# request, which silently breaks PROPAGATION_REQUIRES_NEW (e.g. WebhookDedupService) - a "new"
# transaction ends up reusing the request-bound session/connection instead of getting its own,
# so a caught constraint-violation still poisons the caller's transaction. All existing services
# already map entities to DTOs inside their own @Transactional methods, so nothing relies on
# lazy-loading during view rendering.
spring.jpa.open-in-view=false

# Active profile picks up application-<profile>.properties (e.g. application-test.properties
# for local development, application-prod.properties for production). Override with the
# SPRING_PROFILES_ACTIVE env var; defaults to "test" which also activates NoOpEmailProvider
# (see NoOpEmailProvider's @Profile("test")) so local runs never send real email.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:test}

project.image=image/
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}
app.base.url=${APP_BASE_URL:http://localhost:8080}
frontend.url=${FRONTEND_URL:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

app.email.provider=${EMAIL_PROVIDER:noop}
app.email.async.core-pool-size=2
app.email.async.max-pool-size=5
app.email.async.queue-capacity=50
app.email.async.thread-name-prefix=email-exec-
app.email.default-from=${EMAIL_DEFAULT_FROM:no-reply@example.com}
app.email.retry.max-attempts=${EMAIL_RETRY_MAX_ATTEMPTS:3}
app.email.retry.initial-delay-ms=${EMAIL_RETRY_INITIAL_DELAY_MS:1000}
app.email.retry.multiplier=${EMAIL_RETRY_MULTIPLIER:2}

app.jwt.issuer=${JWT_ISSUER:http://localhost:8080}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:10}
app.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:7}
spring.app.jwtCookieName=${JWT_COOKIE_NAME:springBootEcom}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:3000000}

app.cookie.secure=${COOKIE_SECURE:true}

app.currency=INR

payment.provider.failure-threshold=${PAYMENT_PROVIDER_FAILURE_THRESHOLD:3}
payment.provider.cooldown-minutes=${PAYMENT_PROVIDER_COOLDOWN_MINUTES:5}

# How long a stock reservation holds inventory before the scheduled sweep releases it back.
inventory.reservation.ttl-minutes=${INVENTORY_RESERVATION_TTL_MINUTES:10}
inventory.reservation.expiry-check-interval-ms=${INVENTORY_RESERVATION_EXPIRY_CHECK_INTERVAL_MS:60000}

# Flyway owns schema for tables introduced from here on (provider_health, and more to come);
# everything pre-existing keeps being managed by spring.jpa.hibernate.ddl-auto=update.
# baseline-on-migrate treats the current (Hibernate-managed) schema as already up to date at
# version 0, so only new migrations (version > 0) get applied.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Secrets (DB credentials, JWT signing key, Stripe/Resend keys) live in
# application-<profile>.properties, which is gitignored - never put real secrets in this
# file. Copy application-test.properties.example to application-test.properties for local
# development, filling in real values.

# OAuth2 client registration - supply real client id/secret via env vars per environment
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.client-authentication-method=post
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:YOUR_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:YOUR_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.scope=user:email
spring.security.oauth2.client.registration.github.client-authentication-method=post
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id
