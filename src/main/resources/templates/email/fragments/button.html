<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="button(text,url)">

    <table align="center" cellpadding="0" cellspacing="0">

        <tr>

            <td align="center">

                <a th:href="${url}"
                   style="
        background:#2563eb;
        color:white;
        padding:16px 34px;
        border-radius:8px;
        text-decoration:none;
        display:inline-block;
        font-weight:bold;
        font-size:16px;">

                    <span th:text="${text}"></span>

                </a>

            </td>

        </tr>

    </table>

</div>

</body>

</html>
