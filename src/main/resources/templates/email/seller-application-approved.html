<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body style="margin:0;padding:40px;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellspacing="0" cellpadding="0">

    <tr>

        <td align="center">

            <table width="600"
                   cellspacing="0"
                   cellpadding="0"
                   style="
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 4px 18px rgba(0,0,0,.08);
       ">

                <tr>

                    <td>

                        <div th:replace="~{email/fragments/header :: header('Welcome, Seller!')}"></div>

                    </td>

                </tr>

                <tr>

                    <td style="padding:40px;">

                        <h2 style="margin-top:0;">

                            Hi
                            <span th:text="${name}">Rahul</span>,

                        </h2>

                        <p style="line-height:1.8;color:#555;">

                            Great news - your seller application for
                            <strong th:text="${businessName}">Your Business</strong>
                            has been approved. You can now list and manage products.

                        </p>

                        <div
                                th:replace="~{email/fragments/button ::
button(
'Go to Seller Dashboard',
${sellerDashboardUrl}
)}">
                        </div>

                    </td>

                </tr>

                <tr>

                    <td>

                        <div th:replace="~{email/fragments/footer :: footer}"></div>

                    </td>

                </tr>

            </table>

        </td>

    </tr>

</table>

</body>

</html>
