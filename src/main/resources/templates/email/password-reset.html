<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body style="margin:0;padding:40px;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellspacing="0" cellpadding="0">

    <tr>

        <td align="center">

            <table width="600"
                   cellspacing="0"
                   cellpadding="0"
                   style="
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 4px 18px rgba(0,0,0,.08);
       ">

                <tr>
                    <td>

                        <div th:replace="~{email/fragments/header :: header('Reset Password')}"></div>

                    </td>
                </tr>

                <tr>

                    <td style="padding:40px;">

                        <h2 style="margin-top:0;color:#111827;">

                            Hello
                            <span th:text="${name}">Rahul</span>,

                        </h2>

                        <p style="line-height:1.8;color:#555;">

                            We received a request to reset the password for your account.

                        </p>

                        <p style="line-height:1.8;color:#555;">

                            Click the button below to create a new password.

                        </p>

                        <div
                                th:replace="~{email/fragments/button ::
button(
'Reset Password',
${verificationUrl}
)}">
                        </div>

                        <p style="margin-top:35px;color:#666;">

                            This link expires in
                            <strong>30 minutes.</strong>

                        </p>

                        <p style="color:#666;">

                            If you didn't request a password reset,
                            you can safely ignore this email.

                        </p>

                        <hr style="margin:35px 0;border:none;border-top:1px solid #e5e7eb;">

                        <p style="font-size:13px;color:#888;">

                            Having trouble?

                            Copy and paste this URL into your browser.

                        </p>

                        <a
                                th:href="${resetUrl}"
                                th:text="${resetUrl}"
                                style="word-break:break-all;">
                        </a>

                    </td>

                </tr>

                <tr>

                    <td>

                        <div th:replace="~{email/fragments/footer :: footer}"></div>

                    </td>

                </tr>

            </table>

        </td>

    </tr>

</table>

</body>

</html>
