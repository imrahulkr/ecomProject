# Integration tests (PlatformIntegrationTest). Activated together with "test" so test-profile
# beans (NoOpEmailProvider) apply; values here win over a local application-test.properties.
# The datasource comes from the Testcontainers Postgres via @ServiceConnection.
# Every value below is a dummy - nothing here talks to a real service.

spring.jpa.hibernate.ddl-auto=validate

# Test-only signing key (SHA-512 of a fixed phrase), never used outside tests.
app.jwt.secret=YMBWk4m53QXH004Q/P2NEL09QdpICHT6g2R70IlFOy34iUswynuYVWmbOm6MO13qD3vQabcWFwzDCPq1AQsz3w==
stripe.secret.key=sk_test_dummy
stripe.webhook.secret=whsec_dummy
razorpay.key-id=rzp_test_dummy
razorpay.key-secret=dummy
razorpay.webhook.secret=dummy
resend.api-key=re_dummy
app.cookie.secure=false
app.email.provider=noop

# Keep the schedulers quiet - tests drive reconciliation through the API.
payment.reconciliation.interval-ms=3600000
inventory.reservation.expiry-check-interval-ms=3600000
app.email.outbox.poll-interval-ms=3600000

logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.com.ecommerce.project=INFO
